name: Deploy to GitHub Pages

on:
  # Rebuild + redeploy every time you push to main
  push:
    branches: ["main"]
  # Also lets you trigger a deploy manually from the Actions tab
  workflow_dispatch:

# Sets the permissions the Pages deploy job needs
permissions:
  contents: read
  pages: write
  id-token: write

# Don't run two deploys at once — queue the newest
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
